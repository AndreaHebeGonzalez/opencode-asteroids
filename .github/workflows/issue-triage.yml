name: Issue triage

# Solo en la apertura: si el workflow edita el cuerpo, no debe re-dispararse.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  OPENCODE_VERSION: 1.19.3

jobs:
  triage:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El triage no hace push: no hace falta guardar credenciales de git.
          persist-credentials: false

      - name: Descargar el issue a un archivo
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p triage
          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,createdAt,labels \
            > triage/issue.json

      # El agente no tiene shell, pero el paso de aplicación sí ejecuta código con
      # token: se copia a $RUNNER_TEMP antes del análisis para que no pueda tocarlo.
      - name: Aislar el script de aplicación
        run: cp .github/scripts/issue-triage.js "$RUNNER_TEMP/issue-triage.js"

      - name: Instalar OpenCode
        run: npm install --global --no-fund --no-audit "opencode-ai@$OPENCODE_VERSION"

      # Se usa `opencode run` en lugar de dceoy/opencode-action porque esa action
      # exige que quien abre el issue tenga permisos de escritura en el repo.
      # Además, `run` no publica el resultado como comentario.
      - name: Analizar el issue
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Si el agente no existe, la sesión falla en vez de usar el agente build.
          OPENCODE_CONFIG_CONTENT: '{"default_agent":"triage"}'
        run: |
          opencode run \
            --model opencode/deepseek-v4.1-flash-free \
            --command triage \
            triage/issue.json

      - name: Aplicar el triage
        # Corre incluso si el análisis falló, para marcar el issue como needs-triage.
        if: ${{ !cancelled() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const runIssueTriage = require(`${process.env.RUNNER_TEMP}/issue-triage.js`);
            await runIssueTriage({ github, context, core });
